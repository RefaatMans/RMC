<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="./assets/LogoCircle.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMC — Daily Cash Report</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.css" />

  <style>
    :root{ --bg:#eaf4ff; --card:#fff; --primary:#1f6fff; --primary-600:#1859cc; --accent:#22c1ee; --text:#0f172a; --muted:#475569; --ring:rgba(31,111,255,.35); --shadow:0 10px 30px rgba(2,32,71,.08); --radius-xl:20px; --green:#16a34a; --red:#dc2626 }
    *{ box-sizing:border-box } html,body{ height:100% }
    body{ margin:0; font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial; background:linear-gradient(160deg,#dceeff 0%,#f6f9fc 100%); color:var(--text) }
    .header{ display:flex; align-items:center; justify-content:space-between; padding:20px clamp(16px,4vw,48px); background:linear-gradient(90deg,#1f6fff,#22c1ee); color:#fff }
    .brand{ display:flex; align-items:center; gap:12px; font-weight:800 }
    .back{ text-decoration:none; color:#fff; display:inline-flex; gap:6px; align-items:center }
    .wrap{ max-width:1100px; margin: 24px auto 48px; padding: 0 clamp(16px,4vw,48px) }
    .card{ background:var(--card); border-radius:var(--radius-xl); padding:18px; box-shadow:var(--shadow); border:1px solid rgba(15,23,42,.06); margin-bottom:16px }
    .row{ display:flex; gap:12px; align-items:center; flex-wrap:wrap }
    label{ font-weight:700; color:#0b2447 }
    input{ padding:10px 12px; border-radius:12px; border:1px solid rgba(15,23,42,.12); background:linear-gradient(180deg,#fff,#f0f7ff); outline:none }
    input:focus{ border-color:var(--primary); box-shadow:0 0 0 4px var(--ring) }
    .stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px }
    .stat{ background:#fff; border:1px solid rgba(15,23,42,.08); border-radius:14px; padding:14px }
    .stat h3{ margin:0 0 6px; font-size:0.95rem; color:var(--muted) }
    .amt{ font-weight:900; font-size:1.2rem }
    .in{ color:var(--green) } .out{ color:var(--red) } .net{ color:#0b2447 } .supplies{ color:#b45309 }
    .table-wrap{ border:1px solid rgba(15,23,42,.06); border-radius:12px; overflow:auto; max-height:60vh }
    table{ width:100%; border-collapse:collapse; background:#fff; font-size:.98rem }
    thead th{ position:sticky; top:0; background:#f0f7ff; color:#0b2447; text-align:left; font-weight:800; border-bottom:1px solid rgba(15,23,42,.12); padding:10px 12px }
    tbody td{ padding:10px 12px; border-bottom:1px solid rgba(15,23,42,.06) }
    .empty{ text-align:center; color:var(--muted) }

    /* Doctor filter */
    .filter-doctor{ min-width:240px }
    .ts-wrapper.filter-doctor{ min-width:240px }
    .ts-control{ border-radius:12px !important; border:1px solid rgba(15,23,42,.12) !important; background:linear-gradient(180deg,#fff,#f0f7ff) !important; padding:8px 12px !important }
    .ts-wrapper.focus .ts-control{ border-color:var(--primary) !important; box-shadow:0 0 0 4px var(--ring) !important }
    .scope{ color:var(--muted); font-size:.85rem; margin-top:6px }
  </style>
    <style>
      /* ---- printable daily sheet / doctor receipt ---- */
      #printArea { display: none; }
      @media print {
        body.printing > *:not(#printArea) { display: none !important; }
        body.printing #printArea { display: block !important; }
        body.printing { background: #fff; }
        @page { size: A4 portrait; margin: 10mm; }
      }
      #printArea .dr-head { text-align: center; margin-bottom: 10px; }
      #printArea .dr-head .t1 { font-size: 1.25rem; font-weight: 900; color: #1f6fff; }
      #printArea .dr-head .t2 { font-size: 1.02rem; font-weight: 800; letter-spacing: .04em; }
      #printArea .dr-head .t3 { font-size: .9rem; color: #475569; }
      #printArea table { width: 100%; border-collapse: collapse; font-size: .8rem; }
      #printArea th, #printArea td { border: 1px solid #334155; padding: 3px 5px; }
      #printArea th { background: #e8f0fe; font-weight: 800; text-align: center; }
      #printArea td.c { text-align: center; }
      #printArea td.r { text-align: right; }
      #printArea tfoot td { font-weight: 900; background: #f1f5f9; }
      #printArea .dr-sign { margin-top: 34px; display: flex; justify-content: space-between; gap: 40px; }
      #printArea .dr-sign div { flex: 1; border-top: 1px solid #94a3b8; padding-top: 5px; font-size: .82rem; color: #475569; }
      #printArea .dr-foot { margin-top: 10px; font-size: .74rem; color: #64748b; display: flex; justify-content: space-between; }
    </style>
</head>
<body>
  <header class="header">
    <div class="brand"><img src="./assets/LogoCircle.png" alt="Logo" style="width:8%"><span>Ruwais Medical Center</span></div>
    <a class="back" href="CashHome.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>Back</a>
  </header>

  <main class="wrap">
    <section class="card">
      <div class="row">
        <label for="day">Date</label>
        <input id="day" type="date" />

        <label for="doctorFilter" style="margin-left:8px">Doctor</label>
        <select id="doctorFilter" class="filter-doctor">
          <option value="">All doctors</option>
        </select>

        <button id="printBtn" style="margin-left:auto; border:0; padding:10px 14px; border-radius:10px; font-weight:800; background:#eef4ff; color:#1859cc; border:1px solid rgba(31,111,255,.25); cursor:pointer">Print</button>
        <button id="refreshBtn" style=" border:0; padding:10px 14px; border-radius:10px; font-weight:800; background:linear-gradient(135deg, var(--accent), var(--primary)); color:#fff; cursor:pointer">Refresh</button>
      </div>
      <div class="scope" id="scopeNote">Showing all doctors</div>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat"><h3>Cash In</h3><div class="amt in" id="sumIn">0.00</div></div>
        <div class="stat"><h3>Cash Out</h3><div class="amt out" id="sumOut">0.00</div></div>
        <div class="stat"><h3>Net</h3><div class="amt net" id="sumNet">0.00</div></div>
        <div class="stat"><h3>Supplies (20%)</h3><div class="amt supplies" id="sumSupplies">0.00</div></div>
        <div class="stat"><h3>Doctor 40%</h3><div class="amt in" id="sumDoctor">0.00</div></div>
        <div class="stat"><h3>Center 60%</h3><div class="amt net" id="sumCenter">0.00</div></div>
      </div>
    </section>

    <section class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th style="width:170px">Date/Time</th><th>Patient</th><th>Doctor</th><th>Medical Act</th><th style="width:120px">Type</th><th style="width:120px">Amount</th><th style="width:100px">40%</th><th style="width:100px">NET</th><th style="width:110px">Recorded by</th></tr></thead>
          <tbody id="rows"><tr><td colspan="9" class="empty">No entries</td></tr></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
  <div id="printArea"></div>

  <script src="./js/rmc-auth.js"></script>
  <script src="./js/rmc-helpers.js"></script>

  <script type="module">
  // Optional: keep your own session check
  if (!RMC.requireAuth()) throw new Error('not signed in');

  // ---------- Firebase ----------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import {
    initializeFirestore, collection, getDocs, query, where, orderBy
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
  import {
    getAuth, signInAnonymously, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCy2-qGCMMlNsSuKrqSVUBELsiwQXUN19w",
    authDomain: "rmc-db-486f0.firebaseapp.com",
    projectId: "rmc-db-486f0",
    storageBucket: "rmc-db-486f0.firebasestorage.app",
    messagingSenderId: "711840343507",
    appId: "1:711840343507:web:21bf0e1c9448072ce47b26",
  };

  const app = initializeApp(firebaseConfig);
  const db  = initializeFirestore(app, { experimentalForceLongPolling:true, useFetchStreams:false });
  const auth = getAuth(app);

  // ---------- DOM ----------
  const dayEl    = document.getElementById('day');
  const rows     = document.getElementById('rows');
  const sumInEl  = document.getElementById('sumIn');
  const sumOutEl = document.getElementById('sumOut');
  const sumNetEl = document.getElementById('sumNet');
  const sumDoctorEl = document.getElementById('sumDoctor');
  const sumCenterEl = document.getElementById('sumCenter');
  const sumSuppliesEl = document.getElementById('sumSupplies');
  const refreshBtn = document.getElementById('refreshBtn');
  const doctorFilterEl = document.getElementById('doctorFilter');
  const scopeNote = document.getElementById('scopeNote');

  // Supplies allowance, as a share of the net. Change here to change both the
  // label and the figure.
  const SUPPLIES_RATE = 0.20;

  // ---------- Utils ----------
  const fmtAmt = (n)=> (n<0?'-':'') + Math.abs(n).toFixed(2);
  const fmtDT  = (d)=> {
    const pad2=(x)=>String(x).padStart(2,'0');
    const mer = d.getHours()>=12?'PM':'AM';
    const hh = d.getHours()%12 || 12;
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${hh}:${pad2(d.getMinutes())} ${mer}`;
  };
  const todayISO = ()=> {
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  };
  function dayBounds(dateStr){
    const d = new Date(dateStr);
    const start = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0,0,0,0);
    const end   = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1, 0,0,0,0);
    return [start, end];
  }
  const byName = (a,b)=> (a.name||'').localeCompare(b.name||'', undefined, { sensitivity:'base' });
  const toJsDate = (v)=> v?.toDate ? v.toDate() : (v instanceof Date ? v : (v ? new Date(v) : null));

  // Entries written before the time fix stored `date` at midnight. Fall back to
  // createdAt for those so the column shows a real clock time.
  function cashMoment(x){
    const d = toJsDate(x.date);
    if (d && (d.getHours() || d.getMinutes() || d.getSeconds())) return d;
    const created = toJsDate(x.createdAt) || toJsDate(x.recordedAtLocal);
    if (created && d){
      const sameDay = created.getFullYear()===d.getFullYear()
        && created.getMonth()===d.getMonth() && created.getDate()===d.getDate();
      return sameDay ? created : d;
    }
    return d || created;
  }

  // ---------- Doctor filter ----------
  let doctorTS;
  // Every cash doc fetched for the selected date, before any doctor filtering.
  let dayRows = [];

  async function loadDoctorFilter(){
    const s = await getDocs(collection(db, 'doctors'));
    const doctors = s.docs.map(d => ({ id:d.id, ...d.data() })).sort(byName);

    doctorFilterEl.innerHTML = '';
    const all = document.createElement('option');
    all.value = '';
    all.textContent = 'All doctors';
    doctorFilterEl.appendChild(all);

    for (const d of doctors){
      const o = document.createElement('option');
      o.value = d.id;
      o.textContent = d.name || '(no name)';
      o.dataset.name = d.name || '';
      doctorFilterEl.appendChild(o);
    }

    if (window.TomSelect){
      doctorTS?.destroy();
      doctorTS = new TomSelect('#doctorFilter', {
        create: false,
        allowEmptyOption: true,
        searchField: ['text'],
        sortField: { field:'text', direction:'asc' },
        maxOptions: 5000,
        placeholder: 'All doctors',
        plugins: ['clear_button'],
        onChange: () => render()
      });
    } else {
      doctorFilterEl.addEventListener('change', render);
    }
  }

  function currentDoctor(){
    const id = doctorFilterEl.value;
    if (!id) return null;
    const opt = doctorFilterEl.options[doctorFilterEl.selectedIndex];
    return { id, name: (opt?.dataset?.name || opt?.textContent || '').trim() };
  }

  // Match on doctorId when the cash doc carries one; fall back to the stored
  // name so older entries written without an id still show up.
  function matchesDoctor(x, f){
    if (!f) return true;
    if (x.doctorId) return x.doctorId === f.id;
    return (x.doctorName || '').trim() === f.name;
  }

  // ---------- Data ----------
  async function refresh(){
    const dateStr = dayEl.value;
    if (!dateStr) return;

    const [start, end] = dayBounds(dateStr);

    // NOTE: range filter + orderBy on the same field is required (done here).
    // The doctor filter is applied in memory afterwards, so no composite index
    // is needed and switching doctors costs no extra reads.
    const snap = await getDocs(query(
      collection(db, 'cash'),
      where('date','>=', start),
      where('date','<',  end),
      orderBy('date','asc')
    ));

    dayRows = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }

  function render(){
    const f = currentDoctor();
    const data = dayRows.filter(x => matchesDoctor(x, f));

    scopeNote.textContent = f
      ? `Showing ${data.length} entr${data.length===1?'y':'ies'} for ${f.name}`
      : `Showing all doctors — ${data.length} entr${data.length===1?'y':'ies'}`;

    // totals
    let sumIn=0, sumOut=0, net=0;
    data.forEach(x=>{
      if (x.type==='in')  sumIn  += Number(x.amount||0);
      if (x.type==='out') sumOut += Number(x.amount||0);
      net += Number(x.signedAmount ?? (x.type==='out' ? -Math.abs(x.amount||0) : Math.abs(x.amount||0)));
    });
    sumInEl.textContent  = fmtAmt(sumIn);
    sumOutEl.textContent = fmtAmt(sumOut);
    sumNetEl.textContent = fmtAmt(net);
    sumSuppliesEl.textContent = fmtAmt(net * SUPPLIES_RATE);
    // The doctor's cut is taken on money actually collected (cash in).
    sumDoctorEl.textContent = fmtAmt(RMCH.doctorShare(sumIn));
    sumCenterEl.textContent = fmtAmt(RMCH.centerShare(sumIn));

    // rows
    rows.innerHTML = '';
    if (!data.length){
      rows.innerHTML = `<tr><td colspan="9" class="empty">No entries</td></tr>`;
      return;
    }
    for (const x of data){
      const d = cashMoment(x);
      const amt = (x.type==='out' ? -Math.abs(x.amount||0) : Math.abs(x.amount||0));
      const apptTag = x.appointmentId ? ' <span style="font-size:.72rem;font-weight:800;color:#0b7285">APPT</span>' : '';
      rows.insertAdjacentHTML('beforeend', `
        <tr>
          <td>${d ? fmtDT(d) : '—'}</td>
          <td>${x.patientName || ''}${apptTag}</td>
          <td>${x.doctorName || ''}</td>
          <td>${x.medicalAct || ''}${x.collectionNote ? '<div style="color:#64748b;font-size:.78rem">' + x.collectionNote + '</div>' : ''}</td>
          <td>${x.type==='in' ? '<span class="in">IN</span>' : '<span class="out">OUT</span>'}</td>
          <td class="${amt<0?'out':'in'}" style="font-weight:800">${fmtAmt(amt)}</td>
          <td>${x.type==='in' ? fmtAmt(RMCH.doctorShare(x.amount)) : '—'}</td>
          <td>${x.type==='in' ? fmtAmt(RMCH.centerShare(x.amount)) : '—'}</td>
          <td>${x.recordedByName || '—'}</td>
        </tr>
      `);
    }
  }

  // ---------- Auth gate then init ----------
  onAuthStateChanged(auth, async (user) => {
    try {
      if (!user) { await signInAnonymously(auth); return; } // will fire again with user

  /* ---------------- printable daily sheet ----------------
     Mirrors the paper sign-in sheet: one line per payment with the doctor's
     40% and the net, plus a total row. It prints whatever is on screen, so
     choosing a doctor first gives that doctor's receipt. */
  function buildPrint() {
    const f = currentDoctor();
    const data = dayRows.filter(x => matchesDoctor(x, f));
    const dateStr = dayEl.value || '';

    let n = 0, tAmt = 0, tDoc = 0, tNet = 0;
    const lines = data.map((x) => {
      const inbound = x.type === 'in';
      const amt = Math.abs(Number(x.amount || 0));
      const d40 = inbound ? RMCH.doctorShare(amt) : 0;
      const net = inbound ? RMCH.centerShare(amt) : 0;
      if (inbound) { tAmt += amt; tDoc += d40; tNet += net; }
      else { tAmt -= amt; tNet -= amt; }
      const moment = cashMoment(x);
      const apptAt = x.appointmentAt ? RMCH.toJsDate(x.appointmentAt) : null;
      return `
        <tr>
          <td class="c">${++n}</td>
          <td class="c">${apptAt ? RMCH.fmtTime(apptAt) : '\u2014'}</td>
          <td>${RMCH.esc(x.patientName || '')}</td>
          <td>${RMCH.esc(x.doctorName || '')}</td>
          <td class="r">${inbound ? fmtAmt(amt) : '(' + fmtAmt(amt) + ')'}</td>
          <td>${RMCH.esc(x.medicalAct || '')}</td>
          <td class="r">${inbound ? fmtAmt(d40) : '\u2014'}</td>
          <td class="r">${inbound ? fmtAmt(net) : '\u2014'}</td>
          <td class="c">${moment ? RMCH.fmtTime(moment) : '\u2014'}</td>
        </tr>`;
    }).join('');

    document.getElementById('printArea').innerHTML = `
      <div class="dr-head">
        <div class="t1">Ruwais Medical Center</div>
        <div class="t2">${f ? 'DOCTOR RECEIPT' : 'DAILY REPORT'}</div>
        <div class="t3">Date: ${dateStr}${f ? ' \u2022 ' + RMCH.esc(f.name) : ' \u2022 all doctors'}</div>
      </div>
      <table>
        <thead>
          <tr>
            <th style="width:26px">No.</th>
            <th style="width:62px">Time</th>
            <th>Patient Name</th>
            <th style="width:110px">Doctor</th>
            <th style="width:62px">Amount</th>
            <th style="width:140px">Status</th>
            <th style="width:56px">40%</th>
            <th style="width:62px">NET</th>
            <th style="width:72px">Transaction</th>
          </tr>
        </thead>
        <tbody>${lines || '<tr><td colspan="9" class="c">No entries</td></tr>'}</tbody>
        <tfoot>
          <tr>
            <td colspan="4" class="r">Totals</td>
            <td class="r">${fmtAmt(tAmt)}</td>
            <td></td>
            <td class="r">${fmtAmt(tDoc)}</td>
            <td class="r">${fmtAmt(tNet)}</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
      <div class="dr-sign">
        <div>${f ? 'Doctor signature' : 'Prepared by'}</div>
        <div>Received by</div>
      </div>
      <div class="dr-foot">
        <span>${f ? RMCH.esc(f.name) + ' \u2014 40% share: ' + fmtAmt(tDoc) : 'All doctors'}</span>
        <span>Printed ${new Date().toLocaleString()}</span>
      </div>`;
  }

  function doPrint() {
    buildPrint();
    document.body.classList.add('printing');
    const cleanup = () => {
      document.body.classList.remove('printing');
      window.removeEventListener('afterprint', cleanup);
    };
    window.addEventListener('afterprint', cleanup);
    window.print();
    setTimeout(cleanup, 3000);   // Safari never fires afterprint
  }

      // only run init once we have auth
      document.querySelector('#sumSupplies')
        .closest('.stat').querySelector('h3')
        .textContent = `Supplies (${Math.round(SUPPLIES_RATE * 100)}%)`;
      dayEl.value = todayISO();
      refreshBtn.addEventListener('click', refresh);
      document.getElementById('printBtn').addEventListener('click', doPrint);
      dayEl.addEventListener('change', refresh);

      await loadDoctorFilter();
      await refresh();

    } catch (e) {
      console.error(e);
      alert(`Auth failed: ${e.code || e.message}`);
    }
  });
</script>

</body>
</html>
