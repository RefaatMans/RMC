<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/LogoCircle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RMC — Login</title>
    <style>
      :root {
        --bg: #eaf4ff;
        --card: #fff;
        --primary: #1f6fff;
        --primary-600: #1859cc;
        --accent: #22c1ee;
        --text: #0f172a;
        --muted: #475569;
        --ring: rgba(31, 111, 255, 0.35);
        --shadow: 0 10px 30px rgba(2, 32, 71, 0.08);
        --radius: 16px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial;
        background: linear-gradient(160deg, #dceeff 0%, #f6f9fc 100%);
        color: var(--text);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Hero (like main.html) */
      .hero {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
        padding: 48px 16px 24px;
        margin-top: 4vh;
      }
      .logo {
        width: 140px;
        height: 140px;
        border-radius: 999px;
        object-fit: cover;
        background: #fff;
        box-shadow: 0 10px 24px rgba(2, 32, 71, 0.12);
      }
      .brand {
        margin: 0;
        font-weight: 900;
        letter-spacing: 0.2px;
        color: var(--primary-600);
        font-size: clamp(1.4rem, 3.6vw, 2.2rem);
      }
      .tagline {
        margin: 4px 0 0;
        color: var(--muted);
      }

      /* Centered form card */
      .wrap {
        display: grid;
        place-items: center;
        padding: 0 16px 48px;
      }
      .card {
        width: min(440px, 92vw);
        background: var(--card);
        border-radius: var(--radius);
        padding: 22px 20px 20px;
        border: 1px solid rgba(15, 23, 42, 0.06);
        box-shadow: var(--shadow);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 1.25rem;
      }
      .muted {
        color: var(--muted);
        margin: 0 0 18px;
        font-size: 0.95rem;
      }

      form {
        display: grid;
        gap: 14px;
      }
      label {
        font-weight: 700;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .row {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
      }

      input {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(15, 23, 42, 0.12);
        background: linear-gradient(180deg, #fff, #f0f7ff);
        font-size: 1rem;
        outline: none;
      }
      input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--ring);
      }

      .btn {
        appearance: none;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 800;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, var(--accent), var(--primary));
        box-shadow: 0 10px 24px rgba(2, 32, 71, 0.1);
      }
      .btn:active {
        transform: translateY(1px);
      }

      .link-btn {
        background: none;
        border: 0;
        color: var(--muted);
        cursor: pointer;
        font-weight: 700;
        padding: 8px;
        border-radius: 8px;
      }
      .link-btn:focus {
        outline: none;
        box-shadow: 0 0 0 3px var(--ring);
      }

      .error {
        display: none;
        margin-top: 6px;
        color: #b91c1c;
        background: #fee2e2;
        border: 1px solid #fecaca;
        padding: 10px 12px;
        border-radius: 10px;
        font-size: 0.95rem;
      }
      .error.show {
        display: block;
      }

      noscript {
        display: block;
        margin: 16px 0;
        color: #b91c1c;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Hero (logo + name, like main.html) -->
    <header class="hero" role="banner">
      <img class="logo" src="./assets/LogoCircle.png" alt="RMC logo" />
      <h1 class="brand">Ruwais Medical Center</h1>
      <!-- <p class="tagline">Sign in to continue.</p> -->
    </header>

    <!-- Form card centered under hero -->
    <main class="wrap" role="main">
      <div class="card" aria-label="Sign in form">
        <h1 style="text-align: center">Sign in</h1>
        <hr style="max-width: 70%;"/>
        <!-- <p class="muted">Use your clinic credentials.</p> -->
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              autocomplete="username"
              placeholder="username"
              required
            />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="row">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="•••••••"
                required
              />
              <button
                type="button"
                id="togglePwd"
                class="link-btn"
                aria-controls="password"
                aria-pressed="false"
              >
                Show
              </button>
            </div>
          </div>

          <button class="btn" type="submit">Log in</button>
          <div id="error" class="error">
            Invalid credentials. Please try again.
          </div>
        </form>

        <noscript>JavaScript is required to sign in.</noscript>
      </div>
    </main>

    <script src="./js/rmc-auth.js"></script>
    <script type="module">
      // ---------- Firebase ----------
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
      import {
        initializeFirestore,
        collection,
        doc,
        getDoc,
        getDocs,
        query,
        limit,
        updateDoc,
        serverTimestamp,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
      import {
        getAuth,
        signInAnonymously,
      } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCy2-qGCMMlNsSuKrqSVUBELsiwQXUN19w",
        authDomain: "rmc-db-486f0.firebaseapp.com",
        projectId: "rmc-db-486f0",
        storageBucket: "rmc-db-486f0.firebasestorage.app",
        messagingSenderId: "711840343507",
        appId: "1:711840343507:web:21bf0e1c9448072ce47b26",
      };

      const app = initializeApp(firebaseConfig);
      const db = initializeFirestore(app, {
        experimentalForceLongPolling: true,
        useFetchStreams: false,
      });
      const auth = getAuth(app);

      // ===== Config =====
      const DEST_URL = "main.html"; // where to go after login

      // If already logged in, go to main
      if (RMC.isSignedIn()) {
        window.location.replace(DEST_URL);
      }

      // DOM
      const form = document.getElementById("loginForm");
      const errorBox = document.getElementById("error");
      const userEl = document.getElementById("username");
      const passEl = document.getElementById("password");
      const togglePwd = document.getElementById("togglePwd");
      const submitBtn = form.querySelector('button[type="submit"]');

      // Show/Hide password
      togglePwd.addEventListener("click", () => {
        const show = passEl.type === "password";
        passEl.type = show ? "text" : "password";
        togglePwd.textContent = show ? "Hide" : "Show";
        togglePwd.setAttribute("aria-pressed", String(show));
        passEl.focus();
      });

      function fail(msg) {
        errorBox.textContent = msg || "Invalid credentials. Please try again.";
        errorBox.classList.add("show");
        passEl.focus();
        passEl.select();
      }

      // Say what actually went wrong. A blocked read and a dead connection
      // look the same from the outside otherwise, and the fixes are nothing
      // alike.
      function explain(err) {
        const code = (err && (err.code || err.message)) || "";
        console.error("Sign-in failed:", code, err);
        if (/permission-denied|insufficient permissions/i.test(code)) {
          return (
            "The database refused the request. The security rules need to " +
            "allow the 'users' collection."
          );
        }
        if (/auth\/(operation-not-allowed|admin-restricted)/i.test(code)) {
          return "Anonymous sign-in is turned off for this Firebase project.";
        }
        if (/auth\/network|unavailable|failed-precondition/i.test(code)) {
          return "Couldn't reach the server. Check your connection.";
        }
        return `Sign-in failed (${code || "unknown error"}). See the console.`;
      }

      async function ensureAuthed() {
        if (auth.currentUser) return auth.currentUser;
        const cred = await signInAnonymously(auth);
        return cred.user;
      }

      // The built-in admin only works while the users collection is still
      // empty, so it is a way in to create the first accounts and not a
      // permanent back door.
      async function bootstrapAdmin(username, password) {
        if (username.toLowerCase() !== "admin" || password !== "RMC123$$") {
          return false;
        }
        const any = await getDocs(query(collection(db, "users"), limit(1)));
        return any.empty;
      }

      // Submit
      let busy = false;
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        if (busy) return;
        errorBox.classList.remove("show");

        const username = (userEl.value || "").trim();
        const password = passEl.value || "";
        if (!username || !password) {
          fail("Please enter a username and password.");
          return;
        }

        busy = true;
        const label = submitBtn.textContent;
        submitBtn.disabled = true;
        submitBtn.textContent = "Checking…";

        try {
          await ensureAuthed();
          const snap = await getDoc(doc(db, "users", RMC.userDocId(username)));

          if (snap.exists()) {
            const u = snap.data();
            if (u.active === false) {
              fail("This account is disabled. Ask an administrator.");
              return;
            }
            const ok = await RMC.verifyPassword(password, u);
            if (!ok) {
              fail("Invalid credentials. Please try again.");
              return;
            }
            RMC.signIn({
              id: snap.id,
              username: u.username || username,
              name: u.displayName || u.username || username,
              role: u.role || "user",
            });
            // Best effort — never block the sign-in on it.
            await updateDoc(doc(db, "users", snap.id), {
              lastLoginAt: serverTimestamp(),
            }).catch((e) => console.warn("lastLoginAt not recorded", e));
            window.location.replace(DEST_URL);
            return;
          }

          if (await bootstrapAdmin(username, password)) {
            RMC.signIn({
              id: "admin",
              username: "admin",
              name: "admin",
              role: "admin",
            });
            window.location.replace(DEST_URL);
            return;
          }

          fail("Invalid credentials. Please try again.");
        } catch (err) {
          fail(explain(err));
        } finally {
          busy = false;
          submitBtn.disabled = false;
          submitBtn.textContent = label;
        }
      });
    </script>
  </body>
</html>
