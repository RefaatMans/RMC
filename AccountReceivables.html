<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./assets/LogoCircle.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RMC — Account Receivables</title>
    <style>
      :root {
        --bg: #eaf4ff;
        --card: #fff;
        --primary: #1f6fff;
        --primary-600: #1859cc;
        --accent: #22c1ee;
        --text: #0f172a;
        --muted: #475569;
        --ring: rgba(31, 111, 255, 0.35);
        --shadow: 0 10px 30px rgba(2, 32, 71, 0.08);
        --radius-xl: 20px;
        --grid: #e8eff8;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        background: linear-gradient(160deg, #dceeff 0%, #f6f9fc 100%);
        color: var(--text);
        line-height: 1.45;
      }

      /* header */
      .header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 20px clamp(16px, 4vw, 48px);
        background: linear-gradient(90deg, #1f6fff, #22c1ee);
        color: #fff;
      }
      .brand { display: flex; align-items: center; gap: 12px; font-weight: 800; }
      .name { font-size: clamp(1.1rem, 2.2vw, 1.4rem); }
      .back { color: #fff; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; }

      .wrap { margin: 0 2%; }
      .hero { margin: 16px 0 14px; text-align: center; }
      .hero h1 { margin: 0; font-weight: 900; color: var(--primary-600); }
      .hero p { margin: 4px 0 0; color: var(--muted); font-size: 0.95rem; }

      /* card */
      .card {
        background: var(--card); border-radius: var(--radius-xl);
        padding: 14px 14px 10px; box-shadow: var(--shadow);
        border: 1px solid rgba(15,23,42,.06);
      }
      .toolbar {
        display: flex; gap: 10px; align-items: center; justify-content: space-between;
        margin: 2px 0 8px;
      }
      .btn {
        border: 0; padding: 9px 12px; border-radius: 12px; font-weight: 800; cursor: pointer;
        background: linear-gradient(135deg, var(--accent), var(--primary)); color: #fff;
        box-shadow: 0 8px 18px rgba(2,32,71,.12); font-size: .95rem;
      }
      .btn:active { transform: translateY(1px); }
      .count { color: var(--muted); font-size: .9rem; }

      /* Excel-ish compact table */
      .table-wrap {
        max-height: 78vh; overflow: auto;
        border: 1px solid rgba(15,23,42,.06); border-radius: 12px;
      }
      table {
        width: 100%; border-collapse: separate; border-spacing: 0; background: #fff;
        font-size: .86rem; line-height: 1.2; font-variant-numeric: tabular-nums;
      }
      thead th {
        position: sticky; top: 0; z-index: 2; background: #f0f7ff; color: #0b2447;
        text-align: left; font-weight: 800; padding: 6px 8px; border-bottom: 1px solid var(--grid);
        white-space: nowrap;
      }
      tbody td { padding: 6px 8px; border-bottom: 1px solid var(--grid); border-right: 1px solid var(--grid); }
      tbody td:last-child { border-right: none; }
      tbody tr:nth-child(even) { background: #fbfdff; }
      tbody tr:hover { background: #f6faff; }
      .right { text-align: right; }
/* Fully paid row */
tr.fully-paid {
  background-color: #e6f2ff !important; /* light blue */
}
      /* input inside table cell for editable Paid/Lab */
      .cell-input {
        width: 100%;
        max-width: 90px;
        padding: 4px 6px;
        border-radius: 8px;
        border: 1px solid rgba(15,23,42,.12);
        background: linear-gradient(180deg, #fff, #f0f7ff);
        font-size: .86rem;
        text-align: right;
        outline: none;
      }
      .cell-input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px var(--ring); }

      /* sticky totals row (not used but styled) */
      tfoot td {
        position: sticky; bottom: 0; z-index: 1; background: #f7fbff; font-weight: 900;
        border-top: 1px solid var(--grid); padding: 8px; border-right: 1px solid var(--grid);
      }
      tfoot td:last-child { border-right: none; }

      .muted { color: var(--muted); }

      /* Modal */
      .modal {
        position: fixed; inset: 0; display: none; place-items: center;
        background: rgba(0,0,0,.25); padding: 16px; z-index: 9999;
      }
      .modal.show { display: grid; }
      .dialog {
        width: min(560px, 92vw); background: #fff; border-radius: 16px; padding: 14px;
        border: 1px solid rgba(15,23,42,.1); box-shadow: 0 20px 40px rgba(2,32,71,.18);
        z-index: 10000;
      }
      .dialog h3 { margin: 2px 0 8px; font-size: 1.05rem; }
      .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
      .grid .full { grid-column: 1/-1; }
      label { font-weight: 700; font-size: .92rem; }
      input, select {
        width: 100%; padding: 8px 10px; border-radius: 10px;
        border: 1px solid rgba(15,23,42,.12);
        background: linear-gradient(180deg, #fff, #f0f7ff);
        outline: none; font-size: .95rem;
      }
      input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--ring); }
      .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
      .btn-secondary { background: #eef4ff; color: var(--primary-600); border: 1px solid rgba(31,111,255,.25); }
      .preview { color: var(--muted); font-size: .92rem; }

      /* ---- expandable payment history ---- */
      tr.parent-row { cursor: pointer; }
      tr.parent-row:hover { background: #f6faff; }
      tr.parent-row.open { background: #eef6ff; }
      .caret {
        display: inline-block; width: 14px; text-align: center;
        transition: transform .15s ease; color: var(--muted); font-size: .8rem;
      }
      tr.parent-row.open .caret { transform: rotate(90deg); }
      tr.detail-row > td { background: #f7fbff; padding: 0; }
      .detail-box { padding: 10px 14px 14px; }
      .detail-head {
        display: flex; justify-content: space-between; align-items: center;
        gap: 10px; flex-wrap: wrap; margin-bottom: 8px;
      }
      .detail-head h4 { margin: 0; font-size: .95rem; color: var(--primary-600); }
      .pay-table { width: 100%; border-collapse: collapse; background: #fff; font-size: .86rem; }
      .pay-table th {
        text-align: left; padding: 6px 8px; background: #eaf3ff;
        border-bottom: 1px solid var(--grid); font-weight: 800; white-space: nowrap;
      }
      .pay-table td { padding: 6px 8px; border-bottom: 1px solid var(--grid); }
      .pay-table tfoot td { font-weight: 800; background: #f7fbff; }
      .pay-none { padding: 12px 8px; color: var(--muted); text-align: center; }
      .opening td { color: var(--muted); font-style: italic; }
      .btn-sm { padding: 4px 9px; font-size: .82rem; border-radius: 9px; }
      .btn-danger { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
      .cell-input[readonly] {
        background: transparent; border-color: transparent;
        color: var(--text); font-weight: 700; cursor: pointer;
        /* Let clicks fall through to the row, so clicking anywhere except the
           lab box or a button expands the payments. */
        pointer-events: none;
      }

      /* ---- statement of account print ---- */
      #printArea { display: none; }
      @media print {
        body.printing > *:not(#printArea) { display: none !important; }
        body.printing #printArea { display: block !important; }
        body.printing { background: #fff; }
        @page { margin: 14mm; }
      }
      #printArea .ps-head {
        display: flex; align-items: center; gap: 12px;
        border-bottom: 2px solid #1f6fff; padding-bottom: 10px; margin-bottom: 14px;
      }
      #printArea .ps-head img { width: 58px; height: 58px; border-radius: 999px; }
      #printArea .ps-title { font-size: 1.4rem; font-weight: 900; color: #1f6fff; }
      #printArea .ps-sub { color: #475569; font-size: .9rem; }
      #printArea h2 { font-size: 1.1rem; margin: 0 0 10px; }
      #printArea .ps-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 20px; margin-bottom: 16px; font-size: .95rem; }
      #printArea .ps-meta div { padding: 3px 0; border-bottom: 1px dotted #cbd5e1; }
      #printArea table { width: 100%; border-collapse: collapse; font-size: .92rem; }
      #printArea th, #printArea td { border: 1px solid #cbd5e1; padding: 6px 8px; text-align: left; }
      #printArea th { background: #eff6ff; }
      #printArea td.num, #printArea th.num { text-align: right; }
      #printArea .ps-totals { margin-top: 16px; width: 58%; margin-left: auto; }
      #printArea .ps-totals td { border: 0; border-bottom: 1px solid #e2e8f0; padding: 5px 8px; }
      #printArea .ps-totals tr:last-child td { border-bottom: 0; border-top: 2px solid #1f6fff; font-weight: 900; font-size: 1.05rem; }
      #printArea .ps-foot { margin-top: 30px; color: #64748b; font-size: .82rem; display: flex; justify-content: space-between; }
      #printArea .ps-sign { margin-top: 46px; display: flex; justify-content: space-between; gap: 40px; }
      #printArea .ps-sign div { flex: 1; border-top: 1px solid #94a3b8; padding-top: 5px; font-size: .85rem; color: #475569; }
    </style>
  </head>
  <body>
    <header class="header" role="banner">
      <div class="brand">
        <img src="./assets/LogoCircle.png" alt="Logo" style="width: 8%" />
        <span class="name">Ruwais Medical Center</span>
      </div>
      <a class="back" href="CashHome.html" aria-label="Back">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
        Back
      </a>
    </header>

    <main class="wrap" role="main">
      <section class="hero">
        <h1>Account Receivables</h1>
      </section>

      <section class="card">
        <div class="toolbar">
          <button class="btn" id="btnNew">+ New Record</button>
          <div class="count">
            <span id="recCount">0</span> record(s)
            <span class="muted"> &nbsp;•&nbsp; click a row to see its payments</span>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width: 28px"></th>
                <th style="width: 110px">Date</th>
                <th>Patient</th>
                <th>Doctor</th>
                <th class="right" style="width: 110px">Amount</th>
                <th class="right" style="width: 90px">Paid</th>
                <th class="right" style="width: 110px">Remaining</th>
                <th class="right" style="width: 90px">Lab</th>
                <th class="right" style="width: 120px">Doctor</th>
                <th class="right" style="width: 120px">Center 60%</th>
                <th style="width: 92px"></th>
              </tr>
            </thead>
            <tbody id="bodyRows">
              <tr>
                <td colspan="11" class="muted" style="text-align: center">No data yet.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Add a payment to one receivable -->
    <div class="modal" id="payModal">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="pTitle">
        <h3 id="pTitle">Add payment</h3>
        <div class="preview" id="payContext" style="margin-bottom: 10px"></div>
        <form id="payForm" class="grid">
          <div>
            <label for="payAmount">Amount *</label>
            <input id="payAmount" type="number" step="0.01" min="0.01" required />
          </div>
          <div>
            <label for="payDate">Date *</label>
            <input id="payDate" type="date" required />
          </div>
          <div class="full">
            <label for="payNote">Note</label>
            <input id="payNote" type="text" placeholder="e.g., cash, second instalment" />
          </div>
          <div class="row full">
            <button type="button" class="btn btn-secondary" id="payCancel">Cancel</button>
            <button type="submit" class="btn" id="paySave">Save payment</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Statement of account, filled in just before printing -->
    <div id="printArea"></div>

    <!-- Modal -->
    <div class="modal" id="modal">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mTitle">
        <h3 id="mTitle">New Receivable</h3>
        <form id="recForm" class="grid">
          <div>
            <label for="date">Date *</label>
            <input id="date" name="date" type="date" required />
          </div>
          <div>
            <label for="doctor">Doctor *</label>
            <input id="doctor" name="doctor" required placeholder="Doctor name" />
          </div>
          <div>
            <label for="patient">Patient *</label>
            <input id="patient" name="patient" required placeholder="Patient name" />
          </div>
          <div>
            <label for="amount">Amount *</label>
            <input id="amount" name="amount" type="number" step="0.01" min="0" required />
          </div>
          <div>
            <label for="paid">Paid *</label>
            <input id="paid" name="paid" type="number" step="0.01" min="0" required />
          </div>
          <div>
            <label for="lab">Lab Amount</label>
            <input id="lab" name="lab" type="number" step="0.01" min="0" />
          </div>

          <div class="full preview" id="preview">
            Remaining: 0 • Doctor 40%: 0 • Center 60%: 0
          </div>

          <div class="row full">
            <button type="button" class="btn btn-secondary" id="btnCancel">Cancel</button>
            <button type="submit" class="btn">Save</button>
          </div>
        </form>
      </div>
    </div>

  <script src="./js/rmc-auth.js"></script>
  <script type="module">
  // Gate to your own session flag
  if (!RMC.requireAuth()) throw new Error("not signed in");

  // Firebase SDKs
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
  import {
    initializeFirestore, collection, addDoc, getDocs, deleteDoc,
    query, orderBy, serverTimestamp, updateDoc, doc, setDoc
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
  import {
    getAuth, signInAnonymously, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

  // ---- CONFIG ----
  const firebaseConfig = {
    apiKey: "AIzaSyCy2-qGCMMlNsSuKrqSVUBELsiwQXUN19w",
    authDomain: "rmc-db-486f0.firebaseapp.com",
    projectId: "rmc-db-486f0",
    storageBucket: "rmc-db-486f0.firebasestorage.app",
    messagingSenderId: "711840343507",
    appId: "1:711840343507:web:21bf0e1c9448072ce47b26",
  };

  // ---- INIT ----
  const app = initializeApp(firebaseConfig);
  const db  = initializeFirestore(app, {
    experimentalForceLongPolling: true,
    useFetchStreams: false,
  });
  const auth = getAuth(app);

  /* ---------- Double-submit guard (prevents duplicate records) ---------- */
  function guardSubmit(form, handler, busyLabel) {
    if (!form) return;
    var busy = false;
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (busy) return;              // second click while the first is still running
      busy = true;
      const btns = Array.from(form.querySelectorAll('button[type="submit"]'));
      const labels = btns.map((b) => b.textContent);
      btns.forEach((b) => { b.disabled = true; b.textContent = busyLabel || 'Saving…'; });
      try {
        await handler(e);
      } finally {
        busy = false;
        btns.forEach((b, i) => { b.disabled = false; b.textContent = labels[i]; });
      }
    });
  }
  // One-time write ticket used as the Firestore document ID, so a retried
  // or duplicated write lands on the SAME doc instead of creating a new one.
  function newOpId() {
    return (window.crypto && crypto.randomUUID)
      ? crypto.randomUUID()
      : Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  }


  // ---- DOM refs ----
  const modal = document.getElementById("modal");
  const form = document.getElementById("recForm");
  const bodyRows = document.getElementById("bodyRows");
  const recCount = document.getElementById("recCount");
  const dateEl = document.getElementById("date");
  const patientEl = document.getElementById("patient");
  const doctorEl = document.getElementById("doctor");
  const amountEl = document.getElementById("amount");
  const paidEl = document.getElementById("paid");
  const labEl = document.getElementById("lab");
  const preview = document.getElementById("preview");

  document.getElementById("btnNew").onclick = () => openModal();
  document.getElementById("btnCancel").onclick = () => closeModal();

  // ---- helpers ----
  const fmt = (n) => Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
  const toDate = (yyyy_mm_dd) => {
    const [y, m, d] = (yyyy_mm_dd || "").split("-").map(Number);
    return new Date(y, (m || 1) - 1, d || 1, 0, 0, 0, 0);
  };

  function openModal() {
    dateEl.value = new Date().toISOString().slice(0, 10);
    amountEl.value = ""; paidEl.value = ""; labEl.value = "";
    patientEl.value = ""; doctorEl.value = ""; updatePreview();
    modal.classList.add("show"); document.body.style.overflow = "hidden"; patientEl.focus();
  }
  function closeModal() { modal.classList.remove("show"); document.body.style.overflow = ""; }

  function updatePreview() {
    const amt = Number(amountEl.value || 0);
    const paid = Number(paidEl.value || 0);
    const lab  = Number(labEl.value || 0);
    const remaining = Math.max(0, amt - paid);
    const splitBase = Math.max(0, amt - lab);
    const d40 = splitBase * 0.4, c60 = splitBase * 0.6;
    preview.textContent = `Remaining: ${fmt(remaining)} • Doctor 40%: ${fmt(d40)} • Center 60%: ${fmt(c60)}`;
  }
  labEl.addEventListener("input", updatePreview);
  amountEl.addEventListener("input", updatePreview);
  paidEl.addEventListener("input", updatePreview);

  // ---- Firestore ops ----
  const PAYMENTS = "receivablePayments";
  let payByRec = new Map();   // receivableId -> [payment, ...]
  let recById  = new Map();
  const openRows = new Set(); // which receivables are expanded

  const asDate = (v) =>
    v?.toDate ? v.toDate() : (v instanceof Date ? v : (v ? new Date(v) : null));
  const ymd = (d) => {
    if (!d || isNaN(d)) return "";
    const p = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  };
  const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const sumPayments = (id) =>
    (payByRec.get(id) || []).reduce((t, p) => t + (+p.amount || 0), 0);

  // Money recorded before payment tracking existed. Locked onto the record the
  // first time a payment is added, so the total never drifts afterwards.
  function openingOf(r) {
    if (r.openingPaid != null) return +r.openingPaid || 0;
    return Math.max(0, (+r.paid || 0) - sumPayments(r.id));
  }
  const paidTotal = (r) => openingOf(r) + sumPayments(r.id);

  async function loadReceivables() {
    const [recSnap, paySnap] = await Promise.all([
      getDocs(query(collection(db, "receivables"), orderBy("date", "desc"), orderBy("createdAt", "desc"))),
      getDocs(collection(db, PAYMENTS)),
    ]);
    const rows = recSnap.docs.map((d) => ({ id: d.id, ...d.data() }));

    payByRec = new Map();
    for (const d of paySnap.docs) {
      const pay = { id: d.id, ...d.data() };
      if (!payByRec.has(pay.receivableId)) payByRec.set(pay.receivableId, []);
      payByRec.get(pay.receivableId).push(pay);
    }
    for (const list of payByRec.values()) {
      list.sort((a, b) => (asDate(a.date) || 0) - (asDate(b.date) || 0));
    }
    recById = new Map(rows.map((r) => [r.id, r]));
    render(rows);
  }

  function render(rows) {
    bodyRows.innerHTML = ""; if(recCount) recCount.textContent = rows.length;
    if (!rows.length) {
      bodyRows.innerHTML = `<tr><td colspan="11" class="muted" style="text-align:center">No data yet.</td></tr>`;
      return;
    }
    for (const r of rows) {
      const amt=+r.amount||0, paid=paidTotal(r), lab=+r.lab||0;
      const rem=Math.max(0,amt-paid), splitBase=Math.max(0,amt-lab), d40=splitBase*0.4, c60=splitBase*0.6;
      const dstr = ymd(asDate(r.date));
      const isOpen = openRows.has(r.id);
      const n = (payByRec.get(r.id) || []).length;

      const tr = document.createElement("tr");
      tr.className = "parent-row" + (isOpen ? " open" : "");
      if (paid >= amt && amt > 0) tr.classList.add("fully-paid");
      tr.innerHTML = `
        <td><span class="caret">&#9654;</span></td>
        <td>${dstr}</td>
        <td>${esc(r.patient||"—")}</td>
        <td>${esc(r.doctor||"—")}</td>
        <td class="right">${fmt(amt)}</td>

        <td class="right">
          <input class="cell-input" type="text" readonly tabindex="-1"
            value="${fmt(paid)}" title="Total of the payments below"
            aria-label="Paid total">
        </td>

        <td class="right">${fmt(rem)}</td>

        <td class="right">
          <input class="cell-input lab-input" type="number" step="0.01" min="0"
            value="${lab}" data-id="${r.id}" data-amount="${amt}" aria-label="Lab amount">
        </td>

        <td class="right">${fmt(d40)}</td>
        <td class="right">${fmt(c60)}</td>
        <td class="right"><span class="muted" style="font-size:.8rem">${n || ""}</span></td>`;
      bodyRows.appendChild(tr);

      // Expanding is the row's job; the inputs inside must not trigger it.
      tr.addEventListener("click", (e) => {
        if (e.target.closest("input,button,a")) return;
        if (openRows.has(r.id)) openRows.delete(r.id); else openRows.add(r.id);
        render(rows);
      });

      const labInput = tr.querySelector(".lab-input");
      labInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter"){ e.preventDefault(); labInput.blur(); }});
      labInput.addEventListener("change", () => saveLab(labInput));
      labInput.addEventListener("blur",   () => saveLab(labInput));

      if (isOpen) bodyRows.appendChild(detailRow(r));
    }
  }

  function detailRow(r) {
    const list = payByRec.get(r.id) || [];
    const opening = openingOf(r);
    const amt = +r.amount || 0;
    const paid = paidTotal(r);

    const tr = document.createElement("tr");
    tr.className = "detail-row";
    const td = document.createElement("td");
    td.colSpan = 11;

    const rowsHtml = [
      opening > 0.005
        ? `<tr class="opening">
             <td>—</td>
             <td class="right">${fmt(opening)}</td>
             <td>Opening balance (recorded before payments were tracked)</td>
             <td>—</td>
             <td></td>
           </tr>`
        : "",
      ...list.map((p) => `
        <tr>
          <td>${ymd(asDate(p.date)) || "—"}</td>
          <td class="right">${fmt(+p.amount || 0)}</td>
          <td>${esc(p.note || "")}</td>
          <td>${esc(p.recordedByName || "—")}</td>
          <td class="right"><button class="btn btn-danger btn-sm" data-del="${p.id}">Delete</button></td>
        </tr>`),
    ].join("");

    td.innerHTML = `
      <div class="detail-box">
        <div class="detail-head">
          <h4>Payments — ${esc(r.patient || "—")}</h4>
          <div style="display:flex; gap:8px">
            <button class="btn btn-secondary btn-sm" data-print="${r.id}">Print statement</button>
            <button class="btn btn-sm" data-add="${r.id}">+ Add payment</button>
          </div>
        </div>
        ${
          !list.length && opening <= 0.005
            ? `<div class="pay-none">No payments recorded yet.</div>`
            : `<table class="pay-table">
                 <thead>
                   <tr>
                     <th style="width:110px">Date</th>
                     <th style="width:100px" class="right">Amount</th>
                     <th>Note</th>
                     <th style="width:120px">Recorded by</th>
                     <th style="width:80px"></th>
                   </tr>
                 </thead>
                 <tbody>${rowsHtml}</tbody>
                 <tfoot>
                   <tr>
                     <td>Total paid</td>
                     <td class="right">${fmt(paid)}</td>
                     <td colspan="3">Remaining ${fmt(Math.max(0, amt - paid))} of ${fmt(amt)}</td>
                   </tr>
                 </tfoot>
               </table>`
        }
      </div>`;
    tr.appendChild(td);

    td.querySelector("[data-add]")?.addEventListener("click", () => openPayModal(r));
    td.querySelector("[data-print]")?.addEventListener("click", () => printStatement(r));
    td.querySelectorAll("[data-del]").forEach((b) =>
      b.addEventListener("click", () => deletePayment(r, b.dataset.del)));
    return tr;
  }

  /* ---------------- add / delete a payment ---------------- */
  const payModal   = document.getElementById("payModal");
  const payForm    = document.getElementById("payForm");
  const payAmount  = document.getElementById("payAmount");
  const payDate    = document.getElementById("payDate");
  const payNote    = document.getElementById("payNote");
  const paySave    = document.getElementById("paySave");
  const payContext = document.getElementById("payContext");
  let payTarget = null;

  function openPayModal(r) {
    payTarget = r;
    const remaining = Math.max(0, (+r.amount || 0) - paidTotal(r));
    payContext.textContent =
      `${r.patient || "—"} • ${r.doctor || "—"} • remaining ${fmt(remaining)} of ${fmt(+r.amount || 0)}`;
    payAmount.value = remaining > 0 ? remaining.toFixed(2) : "";
    payDate.value = ymd(new Date());
    payNote.value = "";
    payModal.classList.add("show");
    document.body.style.overflow = "hidden";
    setTimeout(() => payAmount.focus(), 50);
  }
  function closePayModal() {
    payModal.classList.remove("show");
    document.body.style.overflow = "";
    payTarget = null;
    payForm.reset();
  }
  document.getElementById("payCancel").addEventListener("click", closePayModal);
  payModal.addEventListener("click", (e) => { if (e.target === payModal) closePayModal(); });

  // paid on the receivable stays in step with the payments, because the daily
  // and monthly views still read that field.
  async function syncPaid(r, opening) {
    await updateDoc(doc(db, "receivables", r.id), {
      paid: opening + sumPayments(r.id),
      openingPaid: opening,
      updatedAt: serverTimestamp(),
      ...RMC.stamp(),
    });
  }

  let payBusy = false;
  payForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (payBusy || !payTarget) return;
    const amount = Number(payAmount.value);
    if (!isFinite(amount) || amount <= 0) { alert("Enter an amount greater than zero."); return; }
    if (!payDate.value) { alert("Pick a date."); return; }

    const r = payTarget;
    const opening = openingOf(r);
    payBusy = true; paySave.disabled = true; paySave.textContent = "Saving…";
    try {
      const ref = await addDoc(collection(db, PAYMENTS), {
        receivableId: r.id,
        amount,
        note: (payNote.value || "").trim(),
        date: new Date(payDate.value + "T12:00:00"),
        patient: r.patient || null,
        doctor: r.doctor || null,
        createdAt: serverTimestamp(),
        ...RMC.stamp(),
      });
      if (!payByRec.has(r.id)) payByRec.set(r.id, []);
      payByRec.get(r.id).push({ id: ref.id, amount, date: new Date(payDate.value + "T12:00:00") });
      await syncPaid(r, opening);
      openRows.add(r.id);
      closePayModal();
      await loadReceivables();
    } catch (err) {
      console.error(err);
      alert("Couldn't save the payment.");
    } finally {
      payBusy = false; paySave.disabled = false; paySave.textContent = "Save payment";
    }
  });

  async function deletePayment(r, payId) {
    if (!confirm("Delete this payment? The paid total will go down by its amount.")) return;
    const opening = openingOf(r);
    try {
      await deleteDoc(doc(db, PAYMENTS, payId));
      payByRec.set(r.id, (payByRec.get(r.id) || []).filter((p) => p.id !== payId));
      await syncPaid(r, opening);
      await loadReceivables();
    } catch (err) {
      console.error(err);
      alert("Couldn't delete the payment.");
    }
  }

  /* ---------------- statement of account ---------------- */
  function printStatement(r) {
    const list = payByRec.get(r.id) || [];
    const opening = openingOf(r);
    const amt = +r.amount || 0;
    const lab = +r.lab || 0;
    const paid = paidTotal(r);
    const remaining = Math.max(0, amt - paid);

    const lines = [
      opening > 0.005
        ? `<tr><td>—</td><td>Opening balance</td><td class="num">${fmt(opening)}</td></tr>`
        : "",
      ...list.map((p) => `
        <tr>
          <td>${ymd(asDate(p.date)) || "—"}</td>
          <td>${esc(p.note || "Payment")}</td>
          <td class="num">${fmt(+p.amount || 0)}</td>
        </tr>`),
    ].join("");

    document.getElementById("printArea").innerHTML = `
      <div class="ps-head">
        <img src="./assets/LogoCircle.png" alt="">
        <div>
          <div class="ps-title">Ruwais Medical Center</div>
          <div class="ps-sub">Statement of Account</div>
        </div>
      </div>

      <div class="ps-meta">
        <div><strong>Patient:</strong> ${esc(r.patient || "—")}</div>
        <div><strong>Doctor:</strong> ${esc(r.doctor || "—")}</div>
        <div><strong>Record date:</strong> ${ymd(asDate(r.date)) || "—"}</div>
        <div><strong>Printed:</strong> ${ymd(new Date())}</div>
      </div>

      <h2>Payments</h2>
      ${
        !lines
          ? `<p class="ps-sub">No payments recorded.</p>`
          : `<table>
               <thead><tr><th style="width:120px">Date</th><th>Note</th><th class="num" style="width:110px">Amount</th></tr></thead>
               <tbody>${lines}</tbody>
             </table>`
      }

      <table class="ps-totals">
        <tr><td>Total charged</td><td class="num">${fmt(amt)}</td></tr>
        ${lab > 0 ? `<tr><td>Lab</td><td class="num">${fmt(lab)}</td></tr>` : ""}
        <tr><td>Total paid</td><td class="num">${fmt(paid)}</td></tr>
        <tr><td>Balance due</td><td class="num">${fmt(remaining)}</td></tr>
      </table>

      <div class="ps-sign">
        <div>Received by</div>
        <div>Patient signature</div>
      </div>

      <div class="ps-foot">
        <span>Ruwais Medical Center</span>
        <span>Generated ${new Date().toLocaleString()}</span>
      </div>`;

    document.body.classList.add("printing");
    const cleanup = () => {
      document.body.classList.remove("printing");
      window.removeEventListener("afterprint", cleanup);
    };
    window.addEventListener("afterprint", cleanup);
    window.print();
    // Safari and some Android browsers never fire afterprint.
    setTimeout(cleanup, 3000);
  }

  async function saveLab(input) {
    if (!input || input.disabled) return;
    const id = input.dataset.id;
    let newVal = Number(input.value || 0);
    if (!isFinite(newVal) || newVal < 0) newVal = 0;

    // Optional: clamp Lab to not exceed Amount
    const maxAmount = Number(input.dataset.amount || Infinity);
    if (isFinite(maxAmount)) newVal = Math.min(newVal, maxAmount);

    const current = Number(input.getAttribute("value") || 0);
    if (Math.abs(newVal - current) < 0.0001) return;

    input.disabled = true;
    try {
      await updateDoc(doc(db, "receivables", id), { lab: newVal, updatedAt: serverTimestamp(), ...RMC.stamp() });
      input.setAttribute("value", String(newVal));
      await loadReceivables(); // refresh to recalc 40%/60%
    } catch (err) {
      console.error(err); alert("Failed to update lab amount."); input.value = current;
    } finally { input.disabled = false; }
  }

  let recOpId = newOpId();
  guardSubmit(form, async (e) => {
    e.preventDefault();
    if (!form.checkValidity()) return form.reportValidity();
    const payload = {
      date: toDate(document.getElementById("date").value),
      patient: (document.getElementById("patient").value || "").trim(),
      doctor:  (document.getElementById("doctor").value  || "").trim(),
      amount:  Number(document.getElementById("amount").value || 0),
      paid:    Number(document.getElementById("paid").value   || 0),
      lab:     Number(document.getElementById("lab").value    || 0),
      createdAt: serverTimestamp(),
      ...RMC.stamp(),
    };
    try {
      await setDoc(doc(db, "receivables", recOpId), payload);
      recOpId = newOpId();   // fresh ticket for the next receivable
      closeModal(); await loadReceivables();
    } catch (err) { console.error(err); alert("Failed to save. Check console."); }
  });

  // ---- AUTH then load ----
  onAuthStateChanged(auth, async (user) => {
    try {
      if (!user) await signInAnonymously(auth); // silent sign-in
      await loadReceivables();                   // only hit Firestore after auth
    } catch (e) {
      console.error(e);
      alert("Authentication failed; Firestore is protected by rules.");
    }
  });
</script>

  </body>
</html>
